name: Grove
options:
  bundleIdPrefix: io.github.mburisch
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  GroveCore:
    path: Packages/GroveCore
targets:
  Grove:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: GroveCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Grove
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mburisch.Grove
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
schemes:
  Grove:
    build:
      targets:
        Grove: all
    test:
      targets:
        - package: GroveCore/GroveCoreTests
