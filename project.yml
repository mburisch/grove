name: GitIt
options:
  bundleIdPrefix: io.github.mburisch
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  GitItCore:
    path: Packages/GitItCore
targets:
  GitIt:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: GitItCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GitIt
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mburisch.GitIt
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
schemes:
  GitIt:
    build:
      targets:
        GitIt: all
    test:
      targets:
        - package: GitItCore/GitItCoreTests
